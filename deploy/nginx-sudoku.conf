# ---------------------------------------------------------------------------------------------
# 3) Nuovo blocco server (copialo accanto agli altri, dentro "http { ... }")
#    Un solo container serve sia il gioco sia /api, quindi niente rewrite di /api/.
# ---------------------------------------------------------------------------------------------
# Sudoku (HTTPS) - D:\Dev\docker\sudoku
server {
    listen 443 ssl;
    server_name sudoku.vivievegeti.it;

    ssl_certificate /etc/nginx/certs/vivievegeti.pem;
    ssl_certificate_key /etc/nginx/certs/vivievegeti-key.pem;

    resolver 127.0.0.11 valid=30s;

    # Le richieste del gioco sono minuscole (JSON): niente bisogno dei 10m di default.
    client_max_body_size 16k;

    location / {
        set $upstream_sudoku sudoku;
        proxy_pass http://$upstream_sudoku:3000;

        # Qui si ripetono gli header del server: con proxy_set_header nella location, nginx non eredita quelli esterni
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
    }
}
