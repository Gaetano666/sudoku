#    per IP del gioco colpirebbero tutti gli utenti insieme. Va nel blocco "http { ... }".
#    L'elenco è quello ufficiale (https://www.cloudflare.com/ips-v4 e /ips-v6): aggiornalo ogni tanto.
#    L'header CF-Connecting-IP viene creduto solo se la richiesta arriva davvero da questi indirizzi.
