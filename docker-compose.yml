# Sudoku: un container (gioco + API) e un Redis dedicato.
# Il container "sudoku" entra nella rete del proxy (web-gateway); Redis resta in una rete interna,
# raggiungibile solo dal gioco. Segreti e password stanno nel file .env (vedi .env.example).
services:
  sudoku:
    build: .
    container_name: sudoku
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
      SUDOKU_SECRET: ${SUDOKU_SECRET:?imposta SUDOKU_SECRET nel file .env}
      REDIS_URL: redis://:${REDIS_PASSWORD:?imposta REDIS_PASSWORD nel file .env}@sudoku_redis:6379
    depends_on:
      sudoku_redis:
        condition: service_healthy
    networks:
      - web-gateway
      - internal

  sudoku_redis:
    image: redis:7-alpine
    container_name: sudoku_redis
    restart: unless-stopped
    # Persistenza AOF e niente eliminazione automatica: la classifica non deve perdere chiavi.
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --appendonly yes --appendfsync everysec
      --maxmemory 128mb --maxmemory-policy noeviction
    volumes:
      - sudoku_redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 5
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    networks:
      - internal

networks:
  web-gateway:
    external: true
  internal: {}

volumes:
  sudoku_redis_data:
